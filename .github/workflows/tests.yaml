name: Tests

on:
  push:
    branches: [master, upgrade-2.x]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, intl, pdo_mysql
          tools: symfony-cli
      - run: npm install --global yarn@1.22.22
      - run: make install REBUILD_DATABASE=1
      - run: make test.all
      - name: Elasticsearch diagnostics on failure
        if: failure()
        run: make docker.dc ARGS="logs --no-color elasticsearch"

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            sylius: '2.0.18'
          - php: '8.2'
            sylius: '2.1.16'
          - php: '8.3'
            sylius: '2.2.9'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, intl
      - run: composer update --with sylius/sylius:${{ matrix.sylius }} --no-interaction --no-scripts --no-plugins --prefer-dist
      - run: composer validate --strict
      - run: composer phpunit
